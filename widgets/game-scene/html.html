<div class="scene" data-primary="{{primary}}" data-secondary="{{secondary}}">
  <!-- Full-scene backdrop. The JS cuts see-through holes where the camera and game frames sit,
       so the OBS camera and game sources placed under this browser source show through, and keeps
       the shards out from behind the chat panel and the bar. -->
  <div class="rb-backdrop rb-backdrop--shatter scene__backdrop" id="backdrop">
    <div class="rb-backdrop__shards" id="shards"></div>
  </div>

  <div class="rb-frame rb-frame--duo rb-frame--r-xl scene__cam" data-hole aria-hidden="true"></div>
  <div class="rb-frame rb-frame--hairline rb-frame--r-lg scene__game" data-hole aria-hidden="true"></div>

  <!-- Chat panel. The messages come from a separate ProChat browser source placed over .scene__chat-body. -->
  <section class="rb-panel rb-panel--glass scene__chat" data-no-shards>
    <div class="scene__chat-body"></div>
  </section>

  <!-- Bar under the game: title | current opponent | ticker | record -->
  <section class="rb-panel rb-panel--tinted rb-tone-primary scene__bar" data-no-shards>
    <div class="bar__section bar__headline">
      <h2 class="title bar__name" id="bar-title"></h2>
    </div>

    <div class="bar__section bar__vs" id="vs" hidden>
      <p class="rb-eyebrow">Current opponent</p>
      <p class="heading bar__name" id="vs-name"></p>
    </div>

    <div class="bar__section bar__ticker" id="ticker" hidden>
      <div class="ticker__item" id="ticker-item"></div>
      <!-- Sub train: takes the ticker's place while a run of subs is going. Speed lines stream past behind it. -->
      <canvas class="train__lines" id="train-lines"></canvas>
      <div class="train" id="train" hidden>
        <div class="train__count"><small>×</small><span class="train__n"></span></div>
        <div class="train__main">
          <div class="train__row"><span class="train__label">Sub train</span><span class="train__level"></span></div>
          <div class="train__track"><div class="train__progress"><i class="train__grad"></i></div><i class="train__ticks"></i><span class="train__loco">🚂</span></div>
          <div class="train__timer"><i></i></div>
          <div class="train__row"><span class="train__latest"></span><span class="train__time"></span></div>
        </div>
      </div>
    </div>

    <div class="bar__section bar__record" aria-label="Record">
      <span class="stat record__count" id="wins">0</span><span class="rb-eyebrow record__letter">W</span>
      <span class="stat record__count" id="losses">0</span><span class="rb-eyebrow record__letter">L</span>
    </div>
  </section>

  <!-- The sub train's sparks and steam, free to spill out of the bar. -->
  <canvas id="train-fx" width="1920" height="1080"></canvas>
</div>
