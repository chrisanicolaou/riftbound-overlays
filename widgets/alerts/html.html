<div class="alerts" id="alerts" data-primary="{{primary}}" data-secondary="{{secondary}}">
  <!-- Raids pulse a glow around the game capture. -->
  <div class="game-pulse" id="pulse"></div>
  <!-- Effects behind the strip (sparks, rings, flashes) and in front of it (emoji, confetti, glints, shards). -->
  <canvas id="fx-back" width="1920" height="1080"></canvas>
  <div class="alert" id="alert" hidden></div>
  <canvas id="fx-front" width="1920" height="1080"></canvas>
</div>
