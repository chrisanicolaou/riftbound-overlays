<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sound booster</title>
<!-- Makes a quiet alert sound loud enough to upload to StreamElements: scales it so its loudest moment peaks at -1 dBFS
     and saves it as a 16-bit WAV with the same channels (at the browser's audio rate, usually 48kHz, since decoding
     resamples to it). Nothing is uploaded anywhere; the browser does
     the work. Serve the repo root (python -m http.server 8765), open /tools/boost-sound.html and pick a file (any
     format the browser can play, e.g. mp3, mp4/m4a, ogg, wav). ?src=<url> loads a file from the server instead. -->
<style>
  html, body { margin: 0; background: #1b1b1b; color: #ddd; font: 14px/1.4 system-ui, sans-serif; }
  main { max-width: 640px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  p { margin: 8px 0; }
  output { color: #fff; font-variant-numeric: tabular-nums; }
  a.download { display: inline-block; margin-top: 12px; padding: 6px 12px; border: 1px solid #444; border-radius: 4px; background: #222; color: #9f9; text-decoration: none; }
  .error { color: #f99; }
</style>
</head>
<body>
<main>
  <h1>Sound booster</h1>
  <p>Pick a sound. It comes back as a WAV whose loudest moment peaks at -1 dBFS, ready to upload to the alert widget.</p>
  <p><input type="file" id="file" accept="audio/*,video/mp4"></p>
  <p>Length: <output id="length">–</output>, peak before: <output id="before">–</output>, after: <output id="after">–</output></p>
  <p id="result"></p>
</main>
<script>
const TARGET = 10 ** (-1 / 20); // -1 dBFS, about 0.891
const dbfs = (peak) => (peak > 0 ? `${(20 * Math.log10(peak)).toFixed(1)} dBFS` : 'silent');

// The loudest sample across all channels, 0 to 1.
function peakOf(buffer) {
  let peak = 0;
  for (let ch = 0; ch < buffer.numberOfChannels; ch++) {
    for (const v of buffer.getChannelData(ch)) if (Math.abs(v) > peak) peak = Math.abs(v);
  }
  return peak;
}

// A 16-bit PCM WAV of `buffer` with every sample multiplied by `gain`.
function encodeWav(buffer, gain) {
  const channels = buffer.numberOfChannels, rate = buffer.sampleRate, frames = buffer.length;
  const data = frames * channels * 2;
  const out = new DataView(new ArrayBuffer(44 + data));
  const text = (at, s) => [...s].forEach((ch, i) => out.setUint8(at + i, ch.charCodeAt(0)));
  text(0, 'RIFF'); out.setUint32(4, 36 + data, true); text(8, 'WAVE');
  text(12, 'fmt '); out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, channels, true);
  out.setUint32(24, rate, true); out.setUint32(28, rate * channels * 2, true); out.setUint16(32, channels * 2, true); out.setUint16(34, 16, true);
  text(36, 'data'); out.setUint32(40, data, true);
  const samples = [...Array(channels)].map((_, ch) => buffer.getChannelData(ch));
  let at = 44;
  for (let i = 0; i < frames; i++) {
    for (let ch = 0; ch < channels; ch++) {
      const v = Math.max(-1, Math.min(1, samples[ch][i] * gain));
      out.setInt16(at, v < 0 ? v * 0x8000 : v * 0x7fff, true);
      at += 2;
    }
  }
  return out.buffer;
}

// Decodes, boosts and offers the download. Kept on window for checking from the console.
async function boost(data, name) {
  const result = document.getElementById('result');
  result.textContent = '';
  try {
    const buffer = await new AudioContext().decodeAudioData(data);
    const peak = peakOf(buffer);
    if (!peak) throw new Error('That file is silent.');
    const gain = TARGET / peak;
    const wav = encodeWav(buffer, gain);
    document.getElementById('length').textContent = `${buffer.duration.toFixed(2)}s`;
    document.getElementById('before').textContent = dbfs(peak);
    document.getElementById('after').textContent = dbfs(peak * gain);
    const link = Object.assign(document.createElement('a'), {
      className: 'download', href: URL.createObjectURL(new Blob([wav], { type: 'audio/wav' })),
      download: `${name.replace(/\.[^.]+$/, '')} (boosted).wav`, textContent: 'Download the boosted WAV',
    });
    result.append(link);
    window.lastWav = wav;
  } catch (err) {
    result.innerHTML = '';
    result.append(Object.assign(document.createElement('span'), { className: 'error', textContent: `Couldn't read that file: ${err.message}` }));
  }
}

document.getElementById('file').addEventListener('change', async (ev) => {
  const file = ev.target.files[0];
  if (file) boost(await file.arrayBuffer(), file.name);
});
const src = new URLSearchParams(location.search).get('src');
if (src) fetch(src).then((res) => res.arrayBuffer()).then((data) => boost(data, src.split('/').pop()));
</script>
</body>
</html>
