<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sound booster</title>
<!-- Makes a quiet alert sound loud enough to upload to StreamElements: scales it so its loudest moment peaks at -1 dBFS
     and saves it as a 192 kbps, 44.1kHz MP3 (StreamElements doesn't take WAVs), mono or stereo like the original. The
     MP3 encoder (lamejs) loads from jsDelivr; nothing is uploaded anywhere, the browser does the work. Serve the repo
     root (python -m http.server 8765), open /tools/boost-sound.html and pick a file (any format the browser can play,
     e.g. mp3, mp4/m4a, ogg, wav). ?src=<url> loads a file from the server instead. -->
<script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"
  integrity="sha384-xuasJXVcyv3hZq0eYpelEkBC8l4yufatZXDsKuyCU2rqfhDCb+ftuE/mSfZAteiK" crossorigin="anonymous"></script>
<style>
  html, body { margin: 0; background: #1b1b1b; color: #ddd; font: 14px/1.4 system-ui, sans-serif; }
  main { max-width: 640px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  p { margin: 8px 0; }
  output { color: #fff; font-variant-numeric: tabular-nums; }
  a.download { display: inline-block; margin-top: 12px; padding: 6px 12px; border: 1px solid #444; border-radius: 4px; background: #222; color: #9f9; text-decoration: none; }
  .error { color: #f99; }
</style>
</head>
<body>
<main>
  <h1>Sound booster</h1>
  <p>Pick a sound. It comes back as an MP3 whose loudest moment peaks at -1 dBFS, ready to upload to the alert widget.</p>
  <p><input type="file" id="file" accept="audio/*,video/mp4"></p>
  <p>Length: <output id="length">–</output>, peak before: <output id="before">–</output>, after: <output id="after">–</output></p>
  <p id="result"></p>
</main>
<script>
const TARGET = 10 ** (-1 / 20); // -1 dBFS, about 0.891
const RATE = 44100, KBPS = 192;
const dbfs = (peak) => (peak > 0 ? `${(20 * Math.log10(peak)).toFixed(1)} dBFS` : 'silent');

// The loudest sample across all channels, 0 to 1.
function peakOf(buffer) {
  let peak = 0;
  for (let ch = 0; ch < buffer.numberOfChannels; ch++) {
    for (const v of buffer.getChannelData(ch)) if (Math.abs(v) > peak) peak = Math.abs(v);
  }
  return peak;
}

// An MP3 of `buffer` with every sample multiplied by `gain`. MP3 holds one or two channels, so any past two are dropped.
function encodeMp3(buffer, gain) {
  const channels = Math.min(buffer.numberOfChannels, 2);
  const pcm = [...Array(channels)].map((_, ch) => Int16Array.from(buffer.getChannelData(ch), (v) => {
    const s = Math.max(-1, Math.min(1, v * gain));
    return s < 0 ? s * 0x8000 : s * 0x7fff;
  }));
  const encoder = new lamejs.Mp3Encoder(channels, buffer.sampleRate, KBPS);
  const parts = [];
  for (let i = 0; i < buffer.length; i += 1152) parts.push(encoder.encodeBuffer(...pcm.map((c) => c.subarray(i, i + 1152))));
  parts.push(encoder.flush());
  return new Blob(parts, { type: 'audio/mpeg' });
}

// Decodes, boosts and offers the download. "After" is measured on the MP3 itself, decoded again. Kept on window for
// checking from the console.
async function boost(data, name) {
  const result = document.getElementById('result');
  result.textContent = '';
  try {
    if (!window.lamejs) throw new Error("the MP3 encoder didn't load from cdn.jsdelivr.net. Check the connection and reload.");
    const ctx = new AudioContext({ sampleRate: RATE });
    const buffer = await ctx.decodeAudioData(data);
    const peak = peakOf(buffer);
    if (!peak) throw new Error('that file is silent.');
    const mp3 = encodeMp3(buffer, TARGET / peak);
    const after = peakOf(await ctx.decodeAudioData(await mp3.arrayBuffer()));
    document.getElementById('length').textContent = `${buffer.duration.toFixed(2)}s`;
    document.getElementById('before').textContent = dbfs(peak);
    document.getElementById('after').textContent = dbfs(after);
    const link = Object.assign(document.createElement('a'), {
      className: 'download', href: URL.createObjectURL(mp3),
      download: `${name.replace(/\.[^.]+$/, '')} (boosted).mp3`, textContent: 'Download the boosted MP3',
    });
    result.append(link);
    window.lastMp3 = mp3;
  } catch (err) {
    result.innerHTML = '';
    result.append(Object.assign(document.createElement('span'), { className: 'error', textContent: `Couldn't boost that file: ${err.message}` }));
  }
}

document.getElementById('file').addEventListener('change', async (ev) => {
  const file = ev.target.files[0];
  if (file) boost(await file.arrayBuffer(), file.name);
});
const src = new URLSearchParams(location.search).get('src');
if (src) fetch(src).then((res) => res.arrayBuffer()).then((data) => boost(data, src.split('/').pop()));
</script>
</body>
</html>
